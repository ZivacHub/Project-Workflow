<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How the workflow keeps chats on track</title>
  <desc id="d">A project folder holds four files: the goal, the plan board, the decisions and the handoff. /pickup reads them at the start of a chat, you work in plan order, and /handoff rewrites the handoff at the end.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="350" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">One loop, the same commands in every project</text>

  <rect x="20" y="50" width="300" height="280" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="76" font-size="13" font-weight="600" fill="#57606a">YOUR PROJECT FOLDER</text>
  <g font-size="14" fill="#1f2328">
    <rect x="36" y="90" width="268" height="52" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="50" y="112" font-weight="600">Goal</text>
    <text x="50" y="131" font-size="12" fill="#57606a">PRODUCT.md, written in your own words</text>
    <rect x="36" y="150" width="268" height="52" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="50" y="172" font-weight="600">Plan board</text>
    <text x="50" y="191" font-size="12" fill="#57606a">phases and steps, ticked when proven</text>
    <rect x="36" y="210" width="268" height="52" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="50" y="232" font-weight="600">Decisions</text>
    <text x="50" y="251" font-size="12" fill="#57606a">what is decided, what waits on you</text>
    <rect x="36" y="270" width="268" height="52" rx="8" fill="#fbefff" stroke="#c297ff"/>
    <text x="50" y="292" font-weight="600">Handoff</text>
    <text x="50" y="311" font-size="12" fill="#57606a">where the last chat stopped, what is next</text>
  </g>

  <g font-size="14" fill="#1f2328">
    <rect x="440" y="50" width="300" height="76" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="456" y="76" font-weight="700" fill="#0969da">/pickup</text>
    <text x="456" y="97" font-size="12" fill="#57606a">Reads only what the next step needs,</text>
    <text x="456" y="114" font-size="12" fill="#57606a">checks it against git, says where you are.</text>

    <rect x="440" y="160" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="456" y="186" font-weight="700">Work in plan order</text>
    <text x="456" y="207" font-size="12" fill="#57606a">Choices come as plain-words cards;</text>
    <text x="456" y="224" font-size="12" fill="#57606a">nothing is decided without you.</text>

    <rect x="440" y="270" width="300" height="60" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
    <text x="456" y="296" font-weight="700" fill="#8250df">/handoff</text>
    <text x="456" y="315" font-size="12" fill="#57606a">Rewrites the handoff, so the next chat starts clean.</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M320 88 H436"/>
    <path d="M590 128 V156"/>
    <path d="M590 238 V266"/>
    <path d="M436 300 H324"/>
  </g>
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="378" y="80">reads</text>
    <text x="378" y="292">writes</text>
  </g>
</svg>
